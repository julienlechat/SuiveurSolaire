services:
    db:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_DB: suiveurenergie
            POSTGRES_USER: suiveurenergie
            POSTGRES_PASSWORD: suiveurenergie
        volumes:
            - db_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"

    api:
        build: ./backend
        restart: unless-stopped
        depends_on:
            - db
        environment:
            DB_HOST: db
            DB_PORT: 5432
            DB_USER: suiveurenergie
            DB_PASSWORD: suiveurenergie
            DB_NAME: suiveurenergie
            PORT: 3000
        ports:
            - "3001:3000"

    frontend:
        build: ./frontend
        restart: unless-stopped
        depends_on:
        - api
        ports:
        - "1234:1234"

volumes:
    db_data:
